# WHO WE TARGET AND HOW WE PITCH THEM.
#
# Exactly one profile may have `status: active` for the pipeline to run.
# Choosing/activating a profile is a human decision — this file only ever
# gets a status flip when you explicitly ask for it in conversation or
# edit it yourself; the agent never silently switches targets. A second
# gate still applies at run time: --confirm-profile <name> must match.
#
# actor_id/search_input below are verified against the real input schema
# of apify.com/microworlds/leads-finder (fetched live from the Apify API,
# not guessed). If you switch actors, re-check that actor's own schema in
# the Apify Console — field names aren't standardized across actors.

profiles:
  - name: home-service-trades-us
    status: active
    description: >
      US-based HVAC, plumbing, electrical & cleaning companies — solo
      operators and small local businesses (not national franchises or
      large regional players) who need lead generation, appointment
      setting, and AI agent workflow management.
    apify:
      actor_id: microworlds/leads-finder
      search_input:
        # No exact HVAC/plumbing/cleaning category exists in this actor's
        # industry taxonomy, so industry is a broad net (trades tend to
        # fall under Construction; cleaning under Facilities/Consumer
        # Services) and `keywords` does the real narrowing.
        keywords:
          [
            "HVAC",
            "heating and cooling",
            "plumbing",
            "plumber",
            "electrician",
            "electrical contractor",
            "cleaning service",
            "residential cleaning",
            "commercial cleaning",
            "janitorial",
            "handyman",
            "roofing",
            "landscaping",
            "pest control",
          ]
        company_industry: ["Construction", "Facilities Services", "Consumer Services"]
        # Smallest three buckets = solo operators through small local
        # shops, still short of multi-location or franchise scale.
        company_num_employees_range: ["1-10", "11-20", "21-50"]
        company_locations: ["United States"]
        contact_job_titles:
          [
            "Owner",
            "Owner Operator",
            "Founder",
            "President",
            "General Manager",
            "CEO",
            "Managing Partner",
            "Co-Owner",
            "Operations Manager",
          ]
        email_status: ["verified"]
      max_free_results: 25
    email:
      sender_name: "Divya Gupta"
      value_prop: >
        fill their calendar with qualified jobs — done-for-you lead
        generation, appointment setting, and an AI agent that handles
        intake-to-booking so they stop losing jobs to slow follow-up
      cta: "a 15-minute call to see if it's a fit"
      tone: >
        direct, respects their time, speaks like someone who understands
        a trades business day-to-day — no corporate jargon, no fluff
